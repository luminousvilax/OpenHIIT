name: Pre-Release OpenHIIT

run-name: Creating pre-release 🚀

on:
  workflow_dispatch:
  push:
    tags:
      - "*-beta*"

jobs:
  BuildAndroidRelease:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          check-latest: true

      - name: Checkout app code
        uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.41.6"
          cache: true

      - run: flutter pub get

      - name: Download Android keystore
        id: android_keystore
        uses: timheuer/base64-to-file@v2.0
        with:
          fileName: upload-keystore.jks
          encodedString: ${{ secrets.KEYSTORE_FILE_BASE64 }}

      - name: Create key.properties
        run: |
          echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" > android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}" >> android/key.properties

      - name: Build Android Release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build Android Release AppBundle
        run: flutter build appbundle

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk

      - name: Upload Android AppBundle Artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab

  CreateDraftRelease:
    runs-on: ubuntu-latest
    needs: [BuildAndroidRelease]
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v8
        with:
          name: release-apk
          path: apks/

      - name: Download Android AAB Artifact
        uses: actions/download-artifact@v8
        with:
          name: release-aab

      - name: Create Draft Release
        uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: "apks/app-armeabi-v7a-release.apk, apks/app-arm64-v8a-release.apk, apks/app-x86_64-release.apk, app-release.aab"
          draft: true
          tag: ${{ github.ref_name }}
          generateReleaseNotes: true
          skipIfReleaseExists: true
          prerelease: true
